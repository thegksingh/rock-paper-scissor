<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="game-section">
        <h1>Rock Paper Scissors</h1>
        <h3>MAKE YOUR MOVE</h3>
        <div class="score-section">
            <div>Human Score: <span  id="human-score">0</span></div>
            <div>Computer Score: <span id="computer-score">0</span></div>
        </div>
        <div class="player-options">
            <button class="rock">ROCK</button>
            <button class="paper">PAPER</button>
            <button class="scissor">SCISSOR</button>
        </div>

        <div class="result-section">
            <div class="game-result">Game Result</div>
            <div class="choices">
                <div class="choice">You Choosed: <span id="user-emoji"></span></div>
                <div class="choice">Computer Choosed :<span id="computer-emoji"></span></div> 
            </div>
        </div>
        <div class="round-history">
            <div class="round-result" id="round-one">1</div>
            <div class="round-result" id="round-two">2</div>
            <div class="round-result" id="round-three">3</div>
            <div class="round-result" id="round-four">4</div>
            <div class="round-result" id="round-five">5</div>
            <button class="play-again">PLAY AGAIN</button>
        </div>
        
        
    </div>
    
</body>
</html>
